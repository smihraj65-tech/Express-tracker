<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
  <h2 class="text-center text-primary mb-4">Expense Tracker</h2>
  
  <!-- Expense Form -->
  <div class="card p-4 shadow-sm">
    <form id="expenseForm">
      <div class="mb-3">
        <label for="amount" class="form-label">Expense Amount</label>
        <input type="number" class="form-control" id="amount" required>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <input type="text" class="form-control" id="description" required>
      </div>
      <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category">
          <option value="Food">Food</option>
          <option value="Petrol">Petrol</option>
          <option value="Salary">Salary</option>
          <option value="Movie">Movie</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Add Expense</button>
    </form>
  </div>

  <!-- Expense List -->
  <h4 class="mt-5">Expenses List:</h4>
  <ul id="expenseList" class="list-group mt-3">
    <!-- Naye expenses yahan automatically add honge -->
  </ul>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
